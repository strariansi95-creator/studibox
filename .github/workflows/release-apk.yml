name: Release APK

# Релизная ветка: каждый push в release собирает подписанный APK
# и публикует его в GitHub Releases.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Ключ подписи
        id: signing
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Секреты подписи не заданы (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) — сборка пропущена. См. README."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/studibox-release.jks
          {
            echo "storeFile=keystore/studibox-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.enabled == 'true'

      - name: Сборка
        if: steps.signing.outputs.enabled == 'true'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Публикация в Releases
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}-${GITHUB_RUN_NUMBER}"
          APK="studibox-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Студибокс $VERSION (сборка $GITHUB_RUN_NUMBER)" \
            --notes "Автоматическая сборка из ветки release, коммит ${GITHUB_SHA::7}."

      - name: Удаление ключа
        if: always()
        run: rm -f keystore/studibox-release.jks keystore.properties
